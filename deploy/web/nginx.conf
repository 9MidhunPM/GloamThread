server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;
    server_tokens off;
    gzip_static on;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/forge/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location = /healthz { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
    location ~ /\. { deny all; }
    location ~* "^/game-[a-f0-9]{16}\.(wasm|pck|js|png|audio\.worklet\.js|audio\.position\.worklet\.js)$" {
        types { application/wasm wasm; application/octet-stream pck; application/javascript js; image/png png; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(wasm|pck|js|png)$ {
        types { application/wasm wasm; application/octet-stream pck; application/javascript js; image/png png; }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
